<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academic Leadership | Institutional Toolkit</title>
<style>
:root{--navy:#142b49;--blue:#2563eb;--bg:#f4f7fb;--ink:#1d2b40;--muted:#60738c;--line:#dce5f0;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy);padding:9px 13px;border-radius:9px}button:hover{background:#eaf1ff}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.danger{color:#ad2945}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #92baff}a{color:var(--blue)}
header{background:var(--navy);color:white;padding:20px 24px}header h1{font-size:24px;margin:0}header p{margin:6px 0 0;color:#cbd7e8}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 95px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;margin:2px 0;padding:10px}nav button.active{background:#eaf1ff;color:#1647a0;font-weight:700}main{padding:25px;max-width:1450px;width:100%;margin:auto}h2{margin:0 0 8px}h3{margin:0 0 12px}.muted,small{color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 17px;box-shadow:0 3px 15px #122b4610}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.metric strong{display:block;font-size:28px;margin:8px 0;overflow-wrap:anywhere}.status{display:inline-block;border-radius:30px;padding:3px 9px;background:#e9eef7;font-size:12px}.status.ok{background:#dcf7e8;color:#15633d}.status.warn{background:#fff0d2;color:#8c5b00}.status.risk{background:#ffe1e6;color:#992b41}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{background:#f4f7fb;white-space:nowrap}td{overflow-wrap:anywhere;max-width:300px}input[type=text],input[type=date],textarea,select{width:100%;border:1px solid #cbd7e5;border-radius:8px;padding:9px;background:white;color:var(--ink)}textarea{min-height:95px;resize:vertical}label{display:block;font-weight:600;margin-bottom:6px}.field{margin-bottom:15px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.notice{background:#edf4ff;padding:12px;border-radius:9px;color:#284c76}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.lane{background:#f2f6fc;border:1px solid var(--line);padding:12px;border-radius:10px;min-width:0}.task{background:white;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;overflow-wrap:anywhere}.task .toolbar{margin-bottom:0}#logo{max-width:110px;max-height:65px;object-fit:contain;display:none}#toast{min-height:20px;color:#2c6c4d;margin:10px 0}footer{padding:15px 0;color:var(--muted);font-size:12px}@media(max-width:800px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px}nav{display:flex;overflow:auto;gap:4px}nav button{width:auto;white-space:nowrap}main{padding:14px}.board{grid-template-columns:1fr}}@media print{header,aside,.toolbar,.no-print,#toast,footer{display:none!important}.layout{display:block}main{padding:0}.panel{box-shadow:none;break-inside:avoid}body{background:white}input,textarea{border:0!important}}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:15px"><img id="logo" alt="Organization logo"><div><h1 id="orgHeading">Academic Leadership</h1><p>Institutional planning, evidence, performance and governance</p></div></div></header>
<div class="layout"><aside><nav id="nav" aria-label="Toolkit sections"></nav></aside><main><div id="toast" role="status" aria-live="polite"></div><section id="view"></section><footer>Academic Leadership Toolkit · Local browser storage · Export JSON regularly · © Shunya Publications</footer></main></div>
<input type="file" id="importFile" accept=".json,application/json" hidden><input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp" hidden>
<script>
"use strict";
const KEY="academic-leadership-toolkit-v2";
const fields={
naac:["crit|Criterion","artifact|Artifact","owner|Owner","link|Evidence path / URL","status|Status","notes|Notes"],
nirf:["cat|Category","ind|Indicator","val|Value","year|Year","src|Source / Evidence","notes|Notes"],
comp:["item|Compliance item","body|Regulatory body","date|Due date","owner|Owner","status|Status","notes|Notes"],
gov:["body|Governance body","cadence|Cadence","quorum|Quorum","decision|Decision","evid|Evidence","owner|Owner"],
iqac:["art|Artifact","type|Type","prog|Program / Department","link|Evidence path / URL","owner|Owner","ver|Version / Date"],
proj:["name|Project","owner|Owner","start|Start","end|End","status|Status","mile|Milestones"],
obe:["course|Course","pos|POs","cos|COs","assess|Assessment split","evid|Evidence","owner|Owner"],
rs:["type|Output type","title|Title","venue|Venue","value|Impact / Index","year|Year","evid|Evidence / DOI"],
mou:["type|Type","partner|Partner","value|Value / Scope","start|Start","end|End","evid|Evidence"],
fw:["name|Faculty","teach|Teaching hrs","res|Research hrs","adm|Admin hrs","fdp|FDP plan","notes|Notes"],
stu:["prog|Program","place|Placement %","ctc|Median CTC","intern|Internship %","mooc|MOOC credits","notes|Notes"],
risk:["risk|Risk","like|Likelihood","imp|Impact","mit|Mitigation","owner|Owner","status|Status"],
bud:["item|Budget item","type|Capex / Opex","amt|Amount (₹)","src|Funding source","year|Year","owner|Owner"],
comm:["aud|Audience","msg|Message","chan|Channel","cad|Cadence","owner|Owner","notes|Notes"]
};
const sections=[["dashboard","Overview"],["strategy","Five-Year Strategy"],["naac","NAAC Readiness"],["nirf","NIRF Indicators"],["comp","Compliance Calendar"],["gov","Governance Matrix"],["iqac","IQAC Evidence Locker"],["proj","Project Planner"],["obe","OBE / CO–PO"],["rs","Research & Innovation"],["mou","Consultancy & MoUs"],["fw","Faculty & FDP"],["stu","Student Success"],["risk","Risk Register"],["bud","Budget Planner"],["meetings","Minutes Generator"],["comm","Communication Plan"],["actions","Action Tracker"],["rhythm","Operating Rhythm"],["settings","Branding & Data"]];
const strategyFields=[["sp-vision","Vision"],["sp-mission","Mission"],["sp-goals","Strategic goals"],["sp-kpis","KPIs and milestones"],["sp-initiatives","Initiatives and owners"],["sp-alignment","Policy and accreditation alignment"],["sp-policies","Key policies"]];
const meetingFields=[["mt-title","Meeting title"],["mt-date","Meeting date"],["mt-att","Attendees"],["mt-agenda","Agenda"],["mt-decisions","Decisions"],["mt-actions","Action items"]];
const $=id=>document.getElementById(id), el=(tag,txt,cls)=>{let n=document.createElement(tag);if(txt!==undefined)n.textContent=String(txt);if(cls)n.className=cls;return n};
function node(tag,parent,txt,cls){let n=el(tag,txt,cls);parent.append(n);return n}
function btn(label,fn,cls){let b=el("button",label,cls||"");b.type="button";b.addEventListener("click",fn);return b}
function fresh(){return {orgName:"Academic Leadership — Demo",kpis:[{name:"Research output (sample)",value:"22",status:"ok"},{name:"Placement % (sample)",value:"80",status:"warn"},{name:"OBE mapping % (sample)",value:"90",status:"risk"}],todo:[],doing:[],done:[]}}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}
function normalize(){if(!data||typeof data!=="object"||Array.isArray(data))data=fresh();if(!Array.isArray(data.kpis))data.kpis=[];for(const k of [...Object.keys(fields),"todo","doing","done"])if(!Array.isArray(data[k]))data[k]=[]}
normalize();let page="dashboard";
function save(){data._updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(data));notify("Saved locally · "+new Date().toLocaleString())}catch(e){notify("Storage full or blocked. Export JSON to avoid losing changes.",true)}}
function notify(msg,bad=false){let t=$("toast");t.textContent=msg;t.style.color=bad?"#ad2945":"#286b4c"}
function download(name,content,mime){let url=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function jsonExport(){download("academic-leadership-backup.json",JSON.stringify(data,null,2),"application/json")}
function csv(rows,columns){let q=v=>'"'+String(v??"").replaceAll('"','""')+'"';return [columns.map(x=>q(x[1])).join(","),...rows.map(r=>columns.map(x=>q(r[x[0]])).join(","))].join("\r\n")}
function show(p){page=p;$("nav").replaceChildren();for(const [id,title] of sections){let b=btn(title,()=>show(id));if(id===page)b.className="active";$("nav").append(b)}$("view").replaceChildren();$("orgHeading").textContent=String(data.orgName||"Academic Leadership");let logo=$("logo");if(typeof data.orgLogoDataUrl==="string"&&/^data:image\/(png|jpeg|webp);base64,/i.test(data.orgLogoDataUrl)){logo.src=data.orgLogoDataUrl;logo.style.display="block"}else{logo.removeAttribute("src");logo.style.display="none"}let v=$("view");
if(page==="dashboard")dashboard(v);else if(page==="strategy")formPage(v,"Strategic Planning Canvas",strategyFields);else if(page==="meetings")meetings(v);else if(page==="actions")actions(v);else if(page==="rhythm")rhythm(v);else if(page==="settings")settings(v);else tablePage(v,page);
}
function panel(parent,title){let p=node("div",parent,undefined,"panel");node("h2",p,title);return p}
function tools(p){let bar=node("div",p,undefined,"toolbar");bar.append(btn("Export JSON backup",jsonExport),btn("Print / PDF",()=>window.print()));return bar}
function dashboard(v){let p=panel(v,"Leadership Snapshot");node("p",p,"Weekly performance view. Values and statuses are user-entered and require source verification.","muted");tools(p);let grid=node("div",p,undefined,"grid");data.kpis.forEach((k,i)=>{let c=node("div",grid,undefined,"metric");node("small",c,k.name||"KPI");node("strong",c,k.value??"—");node("span",c,k.status||"unclassified","status "+(["ok","warn","risk"].includes(k.status)?k.status:""));let bar=node("div",c,undefined,"toolbar");bar.append(btn("Edit",()=>kpiEditor(i)),btn("Delete",()=>{if(confirm("Delete this KPI?")){data.kpis.splice(i,1);save();show(page)}},"danger"))});p.append(btn("+ Add KPI",()=>kpiEditor(-1),"primary"));let overview=panel(v,"Records by module");let tbl=node("div",overview,undefined,"scroll"),t=node("table",tbl),head=node("tr",t);["Module","Records"].forEach(x=>node("th",head,x));for(const [k,title] of sections.filter(x=>fields[x[0]])){let tr=node("tr",t);node("td",tr,title);node("td",tr,(data[k]||[]).length)}}
function kpiEditor(i){let k=i<0?{name:"",value:"",status:"warn"}:data.kpis[i];let modal=panel($("view"),i<0?"Add KPI":"Edit KPI");modal.scrollIntoView({behavior:"smooth"});let inputs={};for(const key of ["name","value","status"]){let wrap=node("div",modal,undefined,"field");node("label",wrap,key[0].toUpperCase()+key.slice(1));let inp;if(key==="status"){inp=node("select",wrap);for(const s of ["ok","warn","risk"]){let o=node("option",inp,s);o.value=s}inp.value=k.status||"warn"}else{inp=node("input",wrap);inp.type="text";inp.value=String(k[key]??"")}inputs[key]=inp}modal.append(btn("Save KPI",()=>{let x=Object.fromEntries(Object.entries(inputs).map(([k,n])=>[k,n.value]));if(!x.name.trim()){notify("KPI name required",true);return}if(i<0)data.kpis.push(x);else data.kpis[i]=x;save();show("dashboard")},"primary"),btn("Cancel",()=>show("dashboard")))}
function formPage(v,title,arr){let p=panel(v,title);node("p",p,"Update the institutional narrative, targets, responsibilities and supporting decisions.","muted");for(const [key,label] of arr){let wrap=node("div",p,undefined,"field");node("label",wrap,label);let input=node("textarea",wrap);input.value=String(data[key]??"");input.addEventListener("input",()=>{data[key]=input.value;save()})}tools(p)}
function tablePage(v,key){let title=sections.find(x=>x[0]===key)?.[1]||key;let p=panel(v,title),cols=fields[key].map(x=>x.split("|"));node("p",p,"Record source-backed information with clear ownership, dates and evidence references.","muted");let bar=node("div",p,undefined,"toolbar");bar.append(btn("+ Add record",()=>recordEditor(key,-1),"primary"),btn("Export CSV",()=>download(key+".csv",csv(data[key],cols),"text/csv;charset=utf-8")),btn("Print / PDF",()=>window.print()));let search=node("input",p);search.type="text";search.placeholder="Search all records";search.setAttribute("aria-label","Search records");let holder=node("div",p,undefined,"scroll");function draw(){holder.replaceChildren();let t=node("table",holder),h=node("tr",t);cols.forEach(c=>node("th",h,c[1]));node("th",h,"Actions");let q=search.value.toLowerCase();data[key].forEach((r,i)=>{if(!r||typeof r!=="object"||!Object.values(r).some(x=>String(x??"").toLowerCase().includes(q)))return;let tr=node("tr",t);cols.forEach(([f])=>{let td=node("td",tr);let val=String(r[f]??"");if((f==="link"||f==="evid"||f==="src")&&/^https:\/\/[^\s]+$/i.test(val)){let a=node("a",td,val);a.href=val;a.target="_blank";a.rel="noopener noreferrer"}else td.textContent=val});let td=node("td",tr);td.append(btn("Edit",()=>recordEditor(key,i)),btn("Delete",()=>{if(confirm("Delete this record?")){data[key].splice(i,1);save();draw()}},"danger"))});if(!data[key].length)node("p",holder,"No records yet.")}search.addEventListener("input",draw);draw()}
function recordEditor(key,i){let cols=fields[key].map(x=>x.split("|")),current=i<0?{}:data[key][i];let p=panel($("view"),i<0?"New record":"Edit record");p.scrollIntoView({behavior:"smooth"});let inputs={};for(const [k,label] of cols){let f=node("div",p,undefined,"field");node("label",f,label);let inp=node("textarea",f);inp.style.minHeight="55px";inp.value=String(current?.[k]??"");inputs[k]=inp}let bar=node("div",p,undefined,"toolbar");bar.append(btn("Save record",()=>{let row={...(current||{})};for(const [k,inp] of Object.entries(inputs))row[k]=inp.value;if(i<0)data[key].push(row);else data[key][i]=row;save();show(key)},"primary"),btn("Cancel",()=>show(key)))}
function meetings(v){formPage(v,"Meeting Minutes Generator",meetingFields);let p=panel(v,"Meeting record");p.append(btn("Download minutes (.txt)",()=>{let s=[String(data.orgName||"Academic Leadership"),...meetingFields.map(([k,l])=>l+"\n"+String(data[k]||""))].join("\n\n");download("meeting-minutes.txt",s,"text/plain;charset=utf-8")}),btn("Print minutes",()=>window.print()))}
function actions(v){let p=panel(v,"Action Tracker — Kanban");node("p",p,"Keep work items short, with a clear owner and due date. Move them across stages.","muted");let entry=node("textarea",p);entry.placeholder="Action — Owner — Due date";entry.style.minHeight="60px";p.append(btn("Add to backlog",()=>{let s=entry.value.trim();if(!s)return;data.todo.push(s);save();show("actions")},"primary"));let board=node("div",p,undefined,"board");for(const [key,title] of [["todo","Backlog"],["doing","In progress"],["done","Completed"]]){let lane=node("div",board,undefined,"lane");node("h3",lane,title);data[key].forEach((item,i)=>{let task=node("div",lane,undefined,"task");node("div",task,typeof item==="string"?item:JSON.stringify(item));let bar=node("div",task,undefined,"toolbar");if(key!=="todo")bar.append(btn("←",()=>move(key,i,key==="done"?"doing":"todo")));if(key!=="done")bar.append(btn("→",()=>move(key,i,key==="todo"?"doing":"done")));bar.append(btn("Remove",()=>{if(confirm("Remove action?")){data[key].splice(i,1);save();show("actions")}},"danger"))})}}
function move(a,i,b){data[b].push(data[a].splice(i,1)[0]);save();show("actions")}
function rhythm(v){let p=panel(v,"Operating Rhythm & Data Hygiene");for(const [k,t] of [["Weekly","Review KPIs, risks and project progress."],["Monthly","Close and index evidence; share IQAC dashboards."],["Quarterly","Review variance with governing bodies and freeze approved ranking inputs."],["Annually","Review policies, audit trails and evidence-backed institutional decisions."]]){node("h3",p,k);node("p",p,t)}node("p",p,"Use consistent document names, revision identifiers, dates, owners and evidence references.");tools(p)}
function settings(v){let p=panel(v,"Branding, Backup & Restore");node("p",p,"Data is stored in this browser only. Export JSON before clearing browser data or switching devices.","notice");let wrap=node("div",p,undefined,"field");node("label",wrap,"Organization name");let name=node("input",wrap);name.type="text";name.value=String(data.orgName||"");name.addEventListener("change",()=>{data.orgName=name.value;save();$("orgHeading").textContent=name.value});let bar=node("div",p,undefined,"toolbar");bar.append(btn("Upload logo",()=>$("logoFile").click()),btn("Export JSON",jsonExport,"primary"),btn("Import JSON",()=>$("importFile").click()),btn("Clear all data",()=>{if(confirm("Clear all local toolkit data? Export a backup first.")){data=fresh();save();show("dashboard")}},"danger"));node("p",p,"Guide: ", "muted").append(Object.assign(document.createElement("a"),{href:"https://www.shunyapublications.com/leadership.html",textContent:"Academic Leadership Field Guide",target:"_blank",rel:"noopener noreferrer"}));node("p",p,"No account login, shared database or secure evidence storage is included. Use the app for local planning; do not publish confidential records.")}
$("importFile").addEventListener("change",async e=>{let f=e.target.files?.[0];if(!f)return;try{if(f.size>12000000)throw Error("JSON exceeds 12 MB");let incoming=JSON.parse(await f.text());if(!incoming||typeof incoming!=="object"||Array.isArray(incoming)||!Array.isArray(incoming.kpis))throw Error("Invalid toolkit JSON: expected kpis array");if(!confirm("Replace current local data with imported JSON?"))return;data=incoming;normalize();save();show("dashboard")}catch(err){notify("Import failed: "+err.message,true)}finally{e.target.value=""}});
$("logoFile").addEventListener("change",e=>{let f=e.target.files?.[0];if(!f)return;if(!["image/png","image/jpeg","image/webp"].includes(f.type)||f.size>300000){notify("Use a PNG, JPEG or WebP logo under 300 KB.",true);return}let reader=new FileReader();reader.onload=()=>{data.orgLogoDataUrl=reader.result;save();show(page)};reader.readAsDataURL(f);e.target.value=""});
show("dashboard");
</script></body></html>
